<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="resource-title resource-desc">
<title id="resource-title">Resource boundary of the quantum operation</title>
<desc id="resource-desc">An equally likely binary input qubit S, fixed workspace A, and complete Gibbs reservoir B begin independently. One input-independent unitary produces the approximate target on S, restores the ensemble-average marginal of A, and changes the energy of B. Final correlations are allowed. There is no free input label for the controller. All reservoir systems, including those used for recovery, are charged in the mean heat.</desc>
<rect width="1040" height="520" rx="14" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#172b45">
<text x="520" y="43" font-size="30" font-weight="700" text-anchor="middle">The resource boundary</text>
<text x="38" y="87" font-size="20" font-weight="700">INDEPENDENT INPUTS</text>
<text x="500" y="87" font-size="20" font-weight="700" text-anchor="middle">FIXED OPERATION</text>
<text x="694" y="87" font-size="20" font-weight="700">FINAL SYSTEMS</text>
<rect x="380" y="106" width="240" height="312" rx="12" fill="#f1f5f9" stroke="#bdcad9" stroke-width="2"/>
<text x="500" y="187" font-size="23" text-anchor="middle">One preset</text>
<text x="500" y="227" font-size="29" font-weight="700" text-anchor="middle">unitary U</text>
<text x="500" y="263" font-size="23" text-anchor="middle">on S + A + B</text>
<text x="500" y="327" font-size="20" text-anchor="middle">No input label</text>
<text x="500" y="355" font-size="20" text-anchor="middle">for the controls</text>
<rect x="24" y="106" width="300" height="92" rx="10" fill="#edf5ff" stroke="#cbdcf0" stroke-width="2"/>
<rect x="678" y="106" width="338" height="92" rx="10" fill="#edf5ff" stroke="#cbdcf0" stroke-width="2"/>
<path d="M 330 152 H 371" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M 626 152 H 669" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="38" y="134" font-size="23" font-weight="700">Input S</text>
<text x="38" y="162" font-size="20">|x⟩, x = 0 or 1</text>
<text x="38" y="187" font-size="20">Equal probabilities</text>
<text x="694" y="134" font-size="23" font-weight="700">Retained S</text>
<text x="694" y="162" font-size="20">Approximate target</text>
<text x="694" y="187" font-size="20">Max. trace error ≤ ε</text>
<rect x="24" y="216" width="300" height="92" rx="10" fill="#eff9f4" stroke="#c7e1d4" stroke-width="2"/>
<rect x="678" y="216" width="338" height="92" rx="10" fill="#eff9f4" stroke="#c7e1d4" stroke-width="2"/>
<path d="M 330 262 H 371" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M 626 262 H 669" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="38" y="244" font-size="23" font-weight="700">Workspace A</text>
<text x="38" y="272" font-size="20">Fixed initial state</text>
<text x="38" y="297" font-size="20">May be nonthermal</text>
<text x="694" y="244" font-size="23" font-weight="700">Returned A</text>
<text x="694" y="272" font-size="20">Ensemble marginal</text>
<text x="694" y="297" font-size="20">Equals its initial state</text>
<rect x="24" y="326" width="300" height="92" rx="10" fill="#fff6e9" stroke="#ebd6b4" stroke-width="2"/>
<rect x="678" y="326" width="338" height="92" rx="10" fill="#fff6e9" stroke="#ebd6b4" stroke-width="2"/>
<path d="M 330 372 H 371" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M 626 372 H 669" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="38" y="354" font-size="23" font-weight="700">Reservoir B</text>
<text x="38" y="382" font-size="20">Complete Gibbs reservoir</text>
<text x="38" y="407" font-size="20">Recovery systems included</text>
<text x="694" y="354" font-size="23" font-weight="700">Spent reservoir B</text>
<text x="694" y="382" font-size="20">All energy changes</text>
<text x="694" y="407" font-size="20">Count toward mean heat</text>
<text x="520" y="450" font-size="20" text-anchor="middle">Final correlations are allowed; only A’s ensemble marginal returns.</text>
<rect x="24" y="467" width="992" height="37" rx="8" fill="#172b45"/><g fill="#ffffff">
<text x="520" y="492" font-size="19" text-anchor="middle">Mean heat = energy change of all B · reservoir Hamiltonian fixed at boundaries</text>
</g></g></svg>
