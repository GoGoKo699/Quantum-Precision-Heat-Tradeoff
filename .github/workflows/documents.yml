name: Reproducible documents
on:
  push:
    branches: [main, "repository/**"]
    paths: ["paper/**", "learning/report/**", "scripts/*documents*.py", "scripts/verify_manuscript.py", "tests/test_publication.py", ".github/workflows/documents.yml"]
  pull_request:
    paths: ["paper/**", "learning/report/**", "scripts/*documents*.py", "scripts/verify_manuscript.py", "tests/test_publication.py", ".github/workflows/documents.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Regenerate the quantitative plot directly from Python
        run: python paper/Graph/generate_plots.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_manuscript.py
      - name: Build public documents with released TeX Live 2025
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          texlive_version: "2025"
          root_file: |
            paper/Quantum_Precision_Heat_Tradeoff_arXiv.tex
            learning/report/Quantum_Precision_Heat_Tradeoff_Report.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Export and extract the minimal source archive
        run: python scripts/build_documents.py --package-only
      - name: Rebuild only the exported archive
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          texlive_version: "2025"
          root_file: build/documents/zip-extract/Quantum_Precision_Heat_Tradeoff_arXiv.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - run: python scripts/check_compiled_documents.py
      - name: Retain PDFs, package, and verification records
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-documents
          path: |
            paper/Quantum_Precision_Heat_Tradeoff_arXiv.pdf
            paper/Graph/crossover.pdf
            learning/report/Quantum_Precision_Heat_Tradeoff_Report.pdf
            build/documents/Quantum_Precision_Heat_Tradeoff_Overleaf.zip
            build/documents/ci_build_check.json
            build/documents/manuscript_numerics.json
          if-no-files-found: error
