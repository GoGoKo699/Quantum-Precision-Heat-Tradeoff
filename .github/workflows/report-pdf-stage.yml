name: Anonymous report PDF staging
on:
  push:
    branches: ["repository/retain-anonymous-report"]
    paths: ["learning/report/Quantum_Precision_Heat_Tradeoff_Report.tex", ".github/workflows/report-pdf-stage.yml"]
permissions:
  contents: write
jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repository/retain-anonymous-report
      - name: Build the anonymous PDF with TeX Live 2025
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          texlive_version: "2025"
          root_file: learning/report/Quantum_Precision_Heat_Tradeoff_Report.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Validate and commit only the compiled PDF
        run: |
          set -eu
          python scripts/check_report.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/report/Quantum_Precision_Heat_Tradeoff_Report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Refresh author-free explanatory report PDF"
            git push origin HEAD:refs/heads/repository/retain-anonymous-report
          fi
