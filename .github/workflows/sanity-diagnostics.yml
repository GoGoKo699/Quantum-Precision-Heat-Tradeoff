name: Sanity diagnostics
on:
  push:
    branches: [repository/sanity-20261020]
    paths: [.github/workflows/sanity-diagnostics.yml, .maintenance/inspect_github.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p build/sanity
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
          python -m pip freeze > build/sanity/environment.txt
          npm audit --json > build/sanity/npm-audit.json || test $? -eq 1
          npm outdated --json > build/sanity/npm-outdated.json || test $? -eq 1
          cat build/sanity/npm-audit.json
          cat build/sanity/npm-outdated.json
      - run: |
          python -m unittest discover -s tests -v
          python scripts/reproduce.py
          python scripts/check_repository.py
          python scripts/make_figures.py
          git diff --exit-code -- science/figures
          npm run docs:render
      - name: Python dependency audit
        run: |
          python -m venv "$RUNNER_TEMP/audit-tools"
          "$RUNNER_TEMP/audit-tools/bin/pip" install pip-audit
          "$RUNNER_TEMP/audit-tools/bin/pip-audit" -r requirements-dev.txt --format json --output build/sanity/pip-audit.json || test $? -eq 1
          cat build/sanity/pip-audit.json
      - name: Inspect actual hosted pages
        env:
          QPH_INSPECTION_SHA: ${{ github.sha }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          if test -f .maintenance/inspect_github.py; then python .maintenance/inspect_github.py; fi
      - name: Collect exact source and audit tooling
        if: always()
        run: |
          git archive --format=tar.gz HEAD > build/sanity/source.tar.gz
          tar -czf build/sanity/documentation-tools.tar.gz node_modules
          python -m pip download --no-deps --dest build/sanity/wheels setuptools==84.0.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-diagnostics
          path: |
            build/sanity/
            build/hosted-inspection/
          if-no-files-found: error
