name: Refurnish and inspect
on:
  push:
    branches: ["maintenance/refurnish-20261019"]
    paths: [".maintenance/**", ".github/workflows/refurnish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: precision-heat-refurnishing
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/refurnish-20261019
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Check the inherited revision
        if: hashFiles('.maintenance/refurnish.py') != ''
        run: |
          python -m unittest discover -s tests -v
          python scripts/reproduce.py
          python scripts/check_repository.py
      - name: Integrate the topic-based account
        if: hashFiles('.maintenance/refurnish.py') != ''
        run: |
          python .maintenance/patch_migration.py
          python .maintenance/refurnish.py
      - name: Validate the furnished tree
        run: |
          python -m unittest discover -s tests -v
          python scripts/reproduce.py
          python scripts/check_repository.py
          python scripts/make_figures.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base = 'f71a388d84387f9a1cb6d2b7376c9c02743cf1d9'
          for name in ('limiting-crossover.svg', 'resource-boundary.svg'):
              original = subprocess.check_output(['git', 'show', f'{base}:docs/figures/{name}'])
              assert Path('science/figures', name).read_bytes() == original, name
          print('PASS: both figures reproduce byte-for-byte after relocation.')
          PY
          npm run docs:render
          git diff --check
      - name: Publish only the validated branch changes
        id: publish
        run: |
          git fetch origin maintenance/refurnish-20261019
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          rm -f .maintenance/refurnish.py .maintenance/patch_migration.py
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refurnish the complete science, textbook bridge, and shared learning map'
            git push origin HEAD:maintenance/refurnish-20261019
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package the checked sources and local tools for inspection
        if: always()
        run: |
          mkdir -p build/evidence
          tar --exclude=.git --exclude=node_modules --exclude=build --exclude=__pycache__ -czf build/evidence/source.tar.gz .
          tar -czf build/evidence/documentation-tools.tar.gz node_modules
          npm run docs:render || true
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refurnishing-local-evidence
          path: |
            build/evidence/
            build/docs-preview/
          if-no-files-found: error
  hosted:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Inspect the actual hosted pages
        env:
          QPH_INSPECTION_SHA: ${{ needs.prepare.outputs.revision }}
        run: python .maintenance/inspect_hosted.py
      - name: Retain hosted screenshots and DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-github-rendering
          path: build/hosted-inspection/
          if-no-files-found: error
