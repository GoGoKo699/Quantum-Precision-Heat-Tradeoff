name: Audit TeX Live environment
on:
  push:
    branches: [repository/pre-arxiv-final-audit]
    paths: [.github/workflows/audit-texlive-environment.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a generic REVTeX smoke test
        run: |
          mkdir -p build
          cat > build/audit-smoke.tex <<'TEX'
          \documentclass[aps,prl,reprint,amsmath,amssymb,superscriptaddress,longbibliography]{revtex4-2}
          \usepackage{amsmath,amssymb,bm,graphicx,booktabs}
          \usepackage[T1]{fontenc}
          \usepackage[utf8]{inputenc}
          \usepackage{microtype,hyperref,orcidlink,tikz}
          \usetikzlibrary{arrows.meta,positioning,calc}
          \begin{document}
          \title{Typesetting environment check}\author{Example}\affiliation{Example}\date{}
          \begin{abstract}A generic package test, not a manuscript.\end{abstract}\maketitle
          \section{Symbols}
          \(\bm r,\mathcal H,\mathsf X,\mathbb C,\epsilon,\rho,\phi,\tau,\gamma,\sigma,\Omega\).
          \begin{align} A&=\begin{pmatrix}1&0\\0&1\end{pmatrix},&\sum_{j=1}^n x_j&\le\sqrt{n}.\end{align}
          \textbf{Bold} \textit{Italic} \texttt{Code} {\footnotesize Small} {\scriptsize Smaller} {\tiny Tiny}.
          \orcidlink{0000-0002-9297-7622}
          \begin{tikzpicture}\draw[-{Stealth[length=4pt]}] (90:1) arc[start angle=90,end angle=117,radius=1];\node at (1,1) {$|0\rangle$};\end{tikzpicture}
          \begin{thebibliography}{1}\bibitem{example} Example, 2025.\end{thebibliography}
          \end{document}
          TEX
      - name: Released TeX Live 2025 report and package smoke build
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          os: debian
          texlive_version: '2025'
          root_file: |
            build/audit-smoke.tex
            learning/source/Quantum_Precision_Heat_Tradeoff_Report.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
          post_compile: |
            set -eux
            cd "$GITHUB_WORKSPACE"
            mkdir -p build/audit-tex
            tlroot="$(dirname "$(dirname "$(dirname "$(readlink -f "$(command -v pdftex)")")")")"
            test -d "$tlroot/texmf-dist"
            echo "$tlroot" > build/audit-tex/texlive-root.txt
            pdflatex --version > build/audit-tex/version.txt
            {
              sed -n 's/^INPUT //p' build/audit-smoke.fls learning/source/Quantum_Precision_Heat_Tradeoff_Report.fls
              kpsewhich -all texmf.cnf || true
              kpsewhich -progname=pdflatex -format=fmt pdflatex.fmt || true
              command -v pdftex
              command -v kpsewhich
              find "$tlroot/texmf-var/web2c" -name pdflatex.fmt
              find "$tlroot/texmf-dist/fonts/tfm/public/amsfonts" "$tlroot/texmf-dist/fonts/type1/public/amsfonts" "$tlroot/texmf-dist/tex/latex/base" -type f
            } > build/audit-tex/candidate-files.txt
            while IFS= read -r path; do
              [ -f "$path" ] || continue
              resolved="$(readlink -f "$path")"
              case "$resolved" in "$tlroot"/*) echo "${resolved#"$tlroot"/}" ;; esac
              true
            done < build/audit-tex/candidate-files.txt | sort -u > build/audit-tex/runtime-files.txt
            test -s build/audit-tex/runtime-files.txt
            tar -C "$tlroot" -czf build/audit-tex/texlive2025-runtime.tar.gz -T build/audit-tex/runtime-files.txt
            cp learning/source/Quantum_Precision_Heat_Tradeoff_Report.pdf build/audit-tex/
            cp learning/source/Quantum_Precision_Heat_Tradeoff_Report.log build/audit-tex/
      - uses: actions/upload-artifact@v4
        with:
          name: qph-texlive2025-audit-runtime
          path: build/audit-tex/
          retention-days: 1
          if-no-files-found: error
