name: Pinned audit source export
on:
  push:
    branches: [repository/pre-arxiv-final-audit]
    paths: [.github/workflows/audit-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2ca602397ea5dacf43f42c13c5b30b0b3d7731f
      - name: Export the exact inspected source tree
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/qph-current-source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/qph-current-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: qph-pinned-audit-source
          path: |
            ${{ runner.temp }}/qph-current-source.tar.gz
            ${{ runner.temp }}/qph-current-tree.txt
          retention-days: 1
          if-no-files-found: error
