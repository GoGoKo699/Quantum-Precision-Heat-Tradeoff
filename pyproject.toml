[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-precision-heat-tradeoff"
version = "0.1.0"
description = "Reference calculations for precision-dependent heat in quantum operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ruge Lin", email = "gogoko699@gmail.com"}]
license = {file = "LICENSE"}
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[tool.setuptools.packages.find]
include = ["qph*"]
